<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nes_recycle</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="popup">
    <main>
      <h1>nes_recycle</h1>
      <div id="status" class="status" role="status"></div>

      <label>
        回収希望日
        <input id="dateIso" type="date">
        <span class="hint">空欄ならフォーム上の最小指定可能日</span>
      </label>
      <label>
        回収希望時間帯
        <select id="timeValue">
          <option value="">指定なし</option>
          <option value="AM">〜13時</option>
          <option value="14">14時〜16時</option>
          <option value="16">16時〜18時</option>
          <option value="18">18時〜21時</option>
        </select>
      </label>
      <label>
        カプセル種類
        <select id="capsuleType">
          <option value="1">オリジナル</option>
          <option value="2">ヴァーチュオ</option>
          <option value="3">オリジナルとヴァーチュオ</option>
        </select>
      </label>
      <label>
        バッグ数
        <select id="bags">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </label>

      <div class="actions popup-actions">
        <button id="fillButton" type="button">現在のページに入力</button>
        <button id="optionsButton" type="button" class="secondary">設定</button>
      </div>
    </main>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
