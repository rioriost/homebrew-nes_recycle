<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nes_recycle 設定</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="page">
    <main class="container">
      <h1>nes_recycle 設定</h1>
      <p class="lead">
        入力値はこのブラウザプロファイルの拡張機能ストレージに保存されます。フォーム送信は自動実行しません。
      </p>

      <form id="optionsForm">
        <section class="card">
          <h2>プロフィール</h2>
          <div class="grid">
            <label>
              お客様番号
              <input id="customerNumber" type="text" inputmode="numeric" autocomplete="off" maxlength="8" required>
            </label>
            <label>
              姓
              <input id="lastName" type="text" autocomplete="family-name" required>
            </label>
            <label>
              名
              <input id="firstName" type="text" autocomplete="given-name" required>
            </label>
            <label>
              郵便番号
              <input id="postalCode" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="8" required>
            </label>
            <label class="wide">
              回収先住所（都道府県から番地まで）
              <input id="address1" type="text" autocomplete="address-line1" required>
            </label>
            <label class="wide">
              回収先住所（アパート・マンション名と部屋番号）
              <input id="address2" type="text" autocomplete="address-line2">
            </label>
            <label>
              電話番号
              <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" required>
            </label>
            <label>
              メールアドレス
              <input id="email" type="email" autocomplete="email" required>
            </label>
            <label>
              カプセル種類のデフォルト
              <select id="defaultCapsuleType">
                <option value="1">1: オリジナル</option>
                <option value="2">2: ヴァーチュオ</option>
                <option value="3">3: オリジナルとヴァーチュオ</option>
              </select>
            </label>
          </div>
        </section>

        <section class="card">
          <h2>回収条件の既定値</h2>
          <div class="grid">
            <label>
              回収希望日
              <input id="defaultDate" type="date">
              <span class="hint">空欄の場合、フォーム上に表示された最小指定可能日を使います。</span>
            </label>
            <label>
              回収希望時間帯
              <select id="defaultTime">
                <option value="">指定なし</option>
                <option value="AM">〜13時</option>
                <option value="14">14時〜16時</option>
                <option value="16">16時〜18時</option>
                <option value="18">18時〜21時</option>
              </select>
            </label>
            <label>
              回収希望バッグ数
              <select id="defaultBags">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </label>
            <label class="checkbox wide">
              <input id="autoFill" type="checkbox">
              回収フォームを開いたら自動入力する
            </label>
          </div>
        </section>

        <div id="status" class="status" role="status"></div>
        <div class="actions">
          <button type="submit">保存</button>
          <button id="clearButton" type="button" class="secondary">保存値を削除</button>
        </div>
      </form>
    </main>

    <script src="common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
